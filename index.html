<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جيبلي | إدارة المتاجر</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#eaf1ec;font-family:Cairo,sans-serif;color:#17382a}header{background:#064d33;color:white;padding:22px}main{max-width:740px;margin:0 auto;background:white;min-height:100vh}.content{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:15px}label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid #c9dcd0;border-radius:12px;background:white}button{font:inherit;background:#087c43;color:white;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:700}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#e9f6ed;color:#075e39}.upload{display:block;border:2px dashed #9ccfaf;border-radius:16px;padding:18px;text-align:center;cursor:pointer;margin:10px 0}.upload input{display:none}.preview{width:100%;object-fit:cover;background:#e9f6ed;border-radius:15px;display:none}.cover{height:180px}.logo{width:96px;height:96px}.card{border:1px solid #dfebe3;border-radius:18px;padding:16px;margin-bottom:18px}#map{height:290px;border-radius:15px;z-index:0}.status{font-size:13px;margin:12px 0;white-space:pre-wrap}.muted{color:#667c6f;font-size:12px}.hidden{display:none}@media(max-width:500px){.grid{grid-template-columns:1fr}header{padding:16px}.content{padding:12px}}</style></head><body><main><header><h2 style="margin:0">جيبلي | Jeebly</h2><small>إدارة المتاجر · ربط Supabase</small></header><div class="content"><div id="auth" class="card"><h3>تسجيل دخول المدير</h3><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button id="login">دخول</button><p class="muted">يجب أن يكون الحساب موجوداً في Supabase Auth ومضافاً لجدول admins.</p></div><div id="editor" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center"><h3>إضافة متجر</h3><button class="secondary" id="logout">تسجيل خروج</button></div><div class="card"><div class="field"><label>اسم المتجر</label><input id="name" required></div><div class="field"><label>معرّف حساب المالك (UUID)</label><input id="owner_id" placeholder="حساب مسجل في Supabase Auth" required></div><div class="field"><label>الوصف</label><textarea id="description" rows="2"></textarea></div><div class="field"><label>العنوان</label><input id="address" required></div></div><div class="card"><h3>صور المتجر</h3><label>الغلاف</label><label class="upload">اختر صورة غلاف <input id="cover" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="coverPreview" class="preview cover" alt="معاينة الغلاف"><label>الشعار</label><label class="upload">اختر شعار المتجر <input id="logo" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="logoPreview" class="preview logo" alt="معاينة الشعار"></div><div class="card"><h3>موقع المتجر</h3><p class="muted">اضغط على الخريطة لتحديد الموقع أو استخدم موقع الجهاز بإذنك.</p><div id="map"></div><div class="grid" style="margin-top:12px"><div class="field"><label>خط العرض</label><input id="lat" type="number" step="any" value="31.0552"></div><div class="field"><label>خط الطول</label><input id="lng" type="number" step="any" value="46.2610"></div></div><button id="gps" class="secondary" type="button">تحديد موقعي</button></div><button id="save">حفظ المتجر في Supabase</button></div><p id="status" class="status" role="status"></p></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://pwxyusskxwupjqocvhci.supabase.co','sb_publishable_aXzO7NpIJCu9GMgw2WMJ1A_-iWx80Yy');
const $=id=>document.getElementById(id),status=s=>$('status').textContent=s;
const map=L.map('map').setView([31.0552,46.2610],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const marker=L.marker([31.0552,46.2610],{draggable:true}).addTo(map);
function point(lat,lng){if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return;marker.setLatLng([lat,lng]);map.panTo([lat,lng]);$('lat').value=lat.toFixed(6);$('lng').value=lng.toFixed(6)}
map.on('click',e=>point(e.latlng.lat,e.latlng.lng));marker.on('dragend',()=>{const p=marker.getLatLng();point(p.lat,p.lng)});['lat','lng'].forEach(id=>$(id).addEventListener('change',()=>point(Number($('lat').value),Number($('lng').value))));
$('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>point(p.coords.latitude,p.coords.longitude),()=>status('تعذر الحصول على الموقع. يمكنك تحديده على الخريطة.'),{enableHighAccuracy:true});
for(const type of ['cover','logo'])$(type).onchange=()=>{const file=$(type).files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){status('الصورة يجب أن تكون JPG أو PNG أو WebP وبحجم لا يتجاوز 5MB');$(type).value='';return;}const img=$(type+'Preview');img.src=URL.createObjectURL(file);img.style.display='block'};
async function isAdmin(){const{data:{user},error}=await supabase.auth.getUser();if(error||!user)return false;const r=await supabase.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;return !!r.data}
async function refresh(){const ok=await isAdmin();$('auth').classList.toggle('hidden',ok);$('editor').classList.toggle('hidden',!ok);if(ok)setTimeout(()=>map.invalidateSize(),80)}
$('login').onclick=async()=>{status('جارٍ التحقق...');const{error}=await supabase.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){status(error.message);return}try{await refresh();status((await isAdmin())?'تم تسجيل الدخول كمدير':'الحساب ليس لديه صلاحية إدارة')}catch(e){status(e.message)}};
$('logout').onclick=async()=>{await supabase.auth.signOut();await refresh();status('تم تسجيل الخروج')};
async function upload(file,id,kind){if(!file)return null;const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=`${id}/${kind}-${crypto.randomUUID()}.${ext}`;const r=await supabase.storage.from('jeebly-store-media').upload(path,file,{contentType:file.type,upsert:false});if(r.error)throw r.error;return supabase.storage.from('jeebly-store-media').getPublicUrl(path).data.publicUrl}
$('save').onclick=async()=>{const btn=$('save');btn.disabled=true;status('جارٍ الحفظ...');try{if(!(await isAdmin()))throw Error('ليس لديك صلاحية مدير');const name=$('name').value.trim(),owner_id=$('owner_id').value.trim(),address=$('address').value.trim();if(!name||!owner_id||!address)throw Error('يرجى ملء اسم المتجر ومعرّف المالك والعنوان');if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(owner_id))throw Error('معرّف المالك UUID غير صحيح');const latitude=Number($('lat').value),longitude=Number($('lng').value);if(!Number.isFinite(latitude)||!Number.isFinite(longitude)||Math.abs(latitude)>90||Math.abs(longitude)>180)throw Error('إحداثيات غير صالحة');const id=crypto.randomUUID();const uploaded=[];let image_url=null,logo_url=null;try{image_url=await upload($('cover').files[0],id,'cover');if(image_url)uploaded.push(`${id}/cover`);logo_url=await upload($('logo').files[0],id,'logo');if(logo_url)uploaded.push(`${id}/logo`);const r=await supabase.from('stores').insert({id,name,owner_id,address,description:$('description').value.trim(),latitude,longitude,image_url,logo_url,is_open:false,is_approved:false}).select('id').single();if(r.error)throw r.error;status('تم إنشاء المتجر بنجاح. المعرف: '+r.data.id)}catch(e){status('تعذر الحفظ: '+e.message+'\nقد تحتاج الملفات المرفوعة إلى تنظيف إن فشل إنشاء المتجر.')}}catch(e){status(e.message)}finally{btn.disabled=false}};
refresh().catch(e=>status(e.message));
</script></body></html>
